<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Digital Billboard App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="/dashboard">Billboard App</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarMenu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
<li class="nav-item"><a class="nav-link active" href="/register">Register</a></li>
<li class="nav-item"><a class="nav-link text-danger" href="/logout">Logout</a></li>
</ul>
</div>
</div>
</nav>

<div class="container mt-5 form-container">
<div class="card col-lg-4 col-md-6 shadow-lg p-4">
<h2 class="text-center mb-4">Create Account</h2>
<form method="POST">
<label>Username</label>
<input type="text" name="username" class="form-control mb-3" placeholder="Enter username" required>
<label>Password</label>
<input type="password" name="password" class="form-control mb-3" placeholder="Enter password" required>
<button class="btn btn-success w-100">Register</button>
</form>
<p class="text-center mt-3">
Already have an account? <a href="/login">Login</a>
</p>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
