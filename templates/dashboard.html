<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Digital Billboard App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="/dashboard">Billboard App</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarMenu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link active" href="/dashboard">Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
<li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
<li class="nav-item"><a class="nav-link text-danger" href="/logout">Logout</a></li>
</ul>
</div>
</div>
</nav>

<div class="container mt-5">
<h2 class="mb-4">Welcome {{ user }}</h2>
<div class="row g-4">
<div class="col-lg-4 col-md-6">
<div class="card dashboard-card shadow">
<h4>Advertisements</h4>
<p>Upload and manage billboard ads</p>
<button class="btn btn-primary">Upload Ad</button>
</div>
</div>
<div class="col-lg-4 col-md-6">
<div class="card dashboard-card shadow">
<h4>Billboard Locations</h4>
<p>View billboard locations</p>
<button class="btn btn-dark">View Locations</button>
</div>
</div>
<div class="col-lg-4 col-md-6">
<div class="card dashboard-card shadow">
<h4>Subscription</h4>
<p>Manage your subscription</p>
<button class="btn btn-success">Upgrade Plan</button>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
